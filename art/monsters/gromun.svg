<?xml version="1.0" encoding="UTF-8"?>
<!-- Громун, гривастая гарпуна: в воздухе, крылья сложены под пике. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#7d6a52">
    <!-- корпус в пикировании -->
    <path d="M212 116 Q268 132 300 196 Q320 244 304 300 Q272 332 232 316
             Q196 296 192 236 Q190 168 212 116 Z"/>
    <!-- крылья, сложенные вдоль тела -->
    <g fill="#66543e">
      <path d="M212 148 Q140 180 108 268 Q158 246 216 224 Z"/>
      <path d="M296 160 Q372 194 404 282 Q352 258 292 234 Z"/>
    </g>
    <!-- гарпуны-шипы, наклонённые вперёд -->
    <g fill="#d8cfc0">
      <path d="M108 268 L146 300 L112 292 Z"/>
      <path d="M404 282 L366 314 L400 306 Z"/>
      <path d="M120 236 L132 288 L146 244 Z"/>
      <path d="M392 250 L380 302 L366 258 Z"/>
    </g>
    <!-- голова, опущенная по линии атаки -->
    <path d="M232 316 Q206 348 216 396 Q248 384 264 344 Z" fill="#8d7a5f"/>
    <path d="M216 396 L188 424 L224 412 Z" fill="#3f3527"/>
    <!-- грива -->
    <g fill="#9c8a6c">
      <path d="M300 196 L344 180 L308 216 Z"/>
      <path d="M310 232 L356 228 L314 252 Z"/>
    </g>
    <!-- глаз -->
    <circle cx="252" cy="200" r="9" fill="#2b2419"/>
  </g>
</svg>
