<?xml version="1.0" encoding="UTF-8"?>
<!-- Ламент, коронованный пожиратель сигналов: высокий, без лица, свет гаснет вокруг. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g>
    <!-- ореол тьмы -->
    <circle cx="256" cy="256" r="200" fill="#141018"/>
    <circle cx="256" cy="256" r="150" fill="#0d0a12"/>
    <!-- корона-венок -->
    <g fill="#c8a860">
      <path d="M164 148 L188 92 L212 144 L256 76 L300 144 L324 92 L348 148 Q256 120 164 148 Z"/>
    </g>
    <!-- тело-сгусток -->
    <path d="M256 132 Q330 140 350 232 Q366 322 340 424 Q256 452 172 424
             Q146 322 162 232 Q182 140 256 132 Z" fill="#241d2c"/>
    <!-- преломление света по краям -->
    <g fill="none" stroke="#6f5ea8" stroke-width="6" opacity="0.6">
      <path d="M188 180 Q162 260 180 340"/>
      <path d="M324 180 Q350 260 332 340"/>
    </g>
    <!-- пасть: тьма сгущается -->
    <path d="M220 246 Q256 226 292 246 Q288 292 256 306 Q224 292 220 246 Z" fill="#08060c"/>
    <path d="M220 246 Q256 262 292 246" fill="none" stroke="#8a76c8" stroke-width="5"/>
    <!-- шипы вдоль тела -->
    <g fill="#3a3048">
      <path d="M170 250 L136 236 L168 274 Z"/>
      <path d="M342 250 L376 236 L344 274 Z"/>
      <path d="M176 318 L142 320 L176 342 Z"/>
      <path d="M336 318 L370 320 L336 342 Z"/>
    </g>
    <!-- растёкшиеся тени у основания -->
    <g fill="#141018">
      <ellipse cx="256" cy="430" rx="130" ry="26"/>
      <path d="M132 428 Q100 452 76 448 Q108 462 148 444 Z"/>
      <path d="M380 428 Q412 452 436 448 Q404 462 364 444 Z"/>
    </g>
  </g>
</svg>
