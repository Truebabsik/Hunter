<?xml version="1.0" encoding="UTF-8"?>
<!-- Хруз, береговой трущобник: широкий, низкий, одна клешня непомерно большая. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#6b5a44">
    <!-- панцирь -->
    <path d="M96 300 Q256 196 416 300 Q420 372 256 388 Q92 372 96 300 Z"/>
    <!-- ракушечная корка -->
    <g fill="#8d7a5c">
      <circle cx="170" cy="292" r="16"/><circle cx="214" cy="272" r="13"/>
      <circle cx="262" cy="264" r="17"/><circle cx="310" cy="274" r="12"/>
      <circle cx="352" cy="296" r="15"/>
    </g>
    <!-- лапы -->
    <g fill="#584a38">
      <path d="M132 356 L96 416 L128 416 L160 362 Z"/>
      <path d="M188 372 L160 436 L192 436 L216 378 Z"/>
      <path d="M300 378 L324 436 L356 436 L328 372 Z"/>
      <path d="M356 360 L392 416 L424 416 L388 356 Z"/>
    </g>
    <!-- большая клешня -->
    <g fill="#7a6849">
      <path d="M392 268 Q468 240 492 288 Q470 316 424 306 Z"/>
      <path d="M404 300 Q478 306 486 344 Q452 366 414 334 Z"/>
    </g>
    <!-- вторая клешня -->
    <path d="M112 280 Q64 268 56 300 Q84 312 108 300 Z" fill="#6b5a44"/>
    <!-- глаза на стебельках -->
    <g stroke="#3a3128" stroke-width="8" stroke-linecap="round">
      <line x1="222" y1="252" x2="212" y2="216"/>
      <line x1="292" y1="252" x2="302" y2="216"/>
    </g>
    <g fill="#3a3128">
      <circle cx="211" cy="212" r="10"/><circle cx="303" cy="212" r="10"/>
    </g>
  </g>
</svg>
