  <g fill="#6f7a54">
    <!-- тело S-образной волной -->
    <path d="M84 392 Q128 320 216 336 Q318 354 404 300 Q444 276 452 240
             Q470 268 448 310 Q400 372 288 386 Q168 400 116 420 Q92 424 84 392 Z"/>
    <!-- кольца чешуи -->
    <g fill="#586240">
      <ellipse cx="188" cy="356" rx="26" ry="10"/>
      <ellipse cx="248" cy="358" rx="24" ry="9"/>
      <ellipse cx="308" cy="344" rx="22" ry="9"/>
      <ellipse cx="364" cy="316" rx="20" ry="8"/>
    </g>
    <!-- капюшон -->
    <path d="M400 296 Q436 200 500 214 Q470 262 448 300 Z"/>
    <!-- голова -->
    <path d="M396 288 Q428 268 462 280 Q446 320 404 318 Z" fill="#7d8a5e"/>
    <!-- жало -->
    <path d="M452 300 L512 268 L470 312 Z" fill="#3f4730"/>
    <!-- шипы на спине -->
    <g fill="#3f4730">
      <path d="M232 330 L244 288 L262 330 Z"/>
      <path d="M292 320 L306 280 L322 322 Z"/>
      <path d="M348 296 L362 258 L376 298 Z"/>
