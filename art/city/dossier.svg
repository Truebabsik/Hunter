<?xml version="1.0" encoding="UTF-8"?>
<!-- Досье: архив, пюпитр, свеча, карта с непонятными пометками.
     Никаких читаемых букв. Нижняя треть тёмная под панель интерфейса. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#141210"/>
  <!-- полки со свитками -->
  <g fill="#241e18">
    <rect x="0" y="20" width="130" height="120"/>
    <rect x="382" y="20" width="130" height="120"/>
  </g>
  <g fill="#3a2f24">
    <rect x="8" y="34" width="30" height="70" rx="3"/><rect x="44" y="30" width="26" height="74" rx="3"/>
    <rect x="76" y="40" width="30" height="64" rx="3"/><rect x="110" y="36" width="16" height="68" rx="3"/>
    <rect x="390" y="32" width="28" height="72" rx="3"/><rect x="424" y="40" width="30" height="64" rx="3"/>
    <rect x="460" y="34" width="26" height="70" rx="3"/><rect x="492" y="42" width="16" height="62" rx="3"/>
  </g>
  <!-- стопки книг на полу -->
  <g fill="#2c241d">
    <rect x="30" y="150" width="80" height="14" rx="2"/>
    <rect x="38" y="164" width="70" height="12" rx="2"/>
    <rect x="24" y="176" width="88" height="14" rx="2"/>
  </g>
  <!-- карта без подписей -->
  <g fill="#2a2419">
    <rect x="176" y="26" width="160" height="96" rx="3"/>
  </g>
  <g fill="none" stroke="#4a4030" stroke-width="2">
    <path d="M188 100 q22 -30 50 -34 q30 -4 46 12"/>
    <path d="M246 66 q22 6 32 26"/>
  </g>
  <g fill="#c98a4a" opacity="0.7">
    <circle cx="206" cy="82" r="3"/><circle cx="252" cy="66" r="3"/><circle cx="300" cy="94" r="3"/>
  </g>
  <!-- свеча: единственный свет -->
  <circle cx="256" cy="150" r="30" fill="#c98a4a" opacity="0.22"/>
  <rect x="250" y="150" width="12" height="30" fill="#3d3226"/>
  <ellipse cx="256" cy="146" rx="5" ry="9" fill="#e8b070" opacity="0.85"/>
  <!-- пюпитр с раскрытой книгой -->
  <g fill="#332a20">
    <path d="M180 196 L332 196 L316 226 L196 226 Z"/>
  </g>
  <g fill="#4a3f2e">
    <path d="M188 198 L254 190 L254 220 L196 224 Z"/>
    <path d="M258 190 L324 198 L316 224 L258 220 Z"/>
  </g>
  <!-- пометки: закорючки без смысла -->
  <g stroke="#6b5c44" stroke-width="1.5" fill="none">
    <path d="M200 208 q6 -5 12 0 q6 5 12 0"/>
    <path d="M264 206 q6 -5 12 0 q6 5 12 0"/>
  </g>
  <!-- писарь: склонённая голова, рука с пером -->
  <g fill="#171410">
    <path d="M240 132 q18 -22 36 0 l6 40 h-48 Z"/>
    <circle cx="258" cy="126" r="14"/>
  </g>
  <path d="M282 168 l22 -20" stroke="#5a4c38" stroke-width="3"/>
  <!-- нижняя треть — тёмная и пустая -->
  <rect y="210" width="512" height="78" fill="#0f0d0b"/>
</svg>
