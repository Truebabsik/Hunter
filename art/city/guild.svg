<?xml version="1.0" encoding="UTF-8"?>
<!-- Гильдия: полумрак, стол с бумагами, доски с зарубками, лампа.
     Нижняя треть тёмная под панель интерфейса. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#161412"/>
  <!-- стены -->
  <rect width="512" height="210" fill="#1d1a16"/>
  <g fill="#241f19">
    <rect x="0" y="0" width="150" height="210"/>
    <rect x="362" y="0" width="150" height="210"/>
  </g>
  <!-- доски с зарубками: без букв -->
  <g fill="#33291f">
    <rect x="24" y="40" width="96" height="60" rx="3"/>
    <rect x="392" y="34" width="96" height="70" rx="3"/>
  </g>
  <g stroke="#4a3c2c" stroke-width="2">
    <line x1="36" y1="56" x2="36" y2="86"/><line x1="50" y1="52" x2="50" y2="90"/>
    <line x1="64" y1="58" x2="64" y2="84"/><line x1="78" y1="54" x2="78" y2="88"/>
    <line x1="92" y1="60" x2="92" y2="82"/><line x1="106" y1="56" x2="106" y2="86"/>
    <line x1="404" y1="50" x2="404" y2="90"/><line x1="418" y1="46" x2="418" y2="92"/>
    <line x1="432" y1="52" x2="432" y2="88"/><line x1="446" y1="48" x2="446" y2="90"/>
    <line x1="460" y1="54" x2="460" y2="86"/><line x1="474" y1="50" x2="474" y2="88"/>
  </g>
  <!-- снаряжение на дальней стене -->
  <g fill="#2c251d">
    <path d="M196 30 L200 96 L204 30 Z"/>
    <rect x="216" y="34" width="34" height="46" rx="4"/>
  </g>
  <!-- узкое окно -->
  <rect x="330" y="26" width="26" height="74" fill="#3b3a34" opacity="0.8"/>
  <!-- лампа: единственный тёплый свет -->
  <circle cx="256" cy="150" r="26" fill="#c98a4a" opacity="0.28"/>
  <rect x="248" y="150" width="16" height="26" fill="#3a2f22"/>
  <!-- стол -->
  <rect x="150" y="176" width="220" height="12" fill="#3a2f24"/>
  <g fill="#463829">
    <path d="M160 176 l10 0 l-4 -10 l-8 0 Z"/>
    <rect x="196" y="160" width="28" height="16" rx="2"/>
    <rect x="240" y="164" width="16" height="12" rx="2"/>
    <circle cx="286" cy="169" r="6"/>
    <rect x="308" y="162" width="22" height="14" rx="2"/>
  </g>
  <!-- фигура за столом, лицо в тени -->
  <g fill="#141210">
    <path d="M262 132 q18 -22 36 0 l6 44 h-48 Z"/>
    <circle cx="280" cy="126" r="14"/>
  </g>
  <!-- нижняя треть — тёмная и пустая -->
  <rect y="200" width="512" height="88" fill="#100e0c"/>
</svg>
