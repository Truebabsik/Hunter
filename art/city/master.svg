<?xml version="1.0" encoding="UTF-8"?>
<!-- Кузница мастера: горн, наковальня, стойка с оружием.
     Свет только от огня. Нижняя треть тёмная под панель интерфейса. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#12100e"/>
  <!-- навес и стена -->
  <rect y="0" width="512" height="40" fill="#1a1714"/>
  <g fill="#221d18">
    <rect x="0" y="40" width="150" height="170"/>
    <rect x="380" y="40" width="132" height="170"/>
  </g>
  <!-- стойка с оружием -->
  <g stroke="#3a2f22" stroke-width="3">
    <line x1="400" y1="60" x2="400" y2="170"/>
    <line x1="500" y1="60" x2="500" y2="170"/>
  </g>
  <g fill="#4a4034">
    <path d="M410 62 l6 66 l6 -66 Z"/>
    <rect x="440" y="70" width="8" height="54" rx="2"/>
    <path d="M432 74 q14 -22 28 0" fill="none" stroke="#4a4034" stroke-width="5"/>
    <rect x="468" y="66" width="26" height="8" rx="2"/>
    <path d="M470 96 l42 -4 l0 6 l-42 4 Z"/>
  </g>
  <!-- горн: главный источник света -->
  <g>
    <rect x="168" y="150" width="120" height="60" fill="#2a231c"/>
    <ellipse cx="228" cy="152" rx="48" ry="14" fill="#c98a4a" opacity="0.75"/>
    <ellipse cx="228" cy="146" rx="30" ry="9" fill="#e8b070" opacity="0.6"/>
    <ellipse cx="228" cy="140" rx="46" ry="26" fill="#c98a4a" opacity="0.12"/>
  </g>
  <!-- искры -->
  <g fill="#e8b070" opacity="0.7">
    <circle cx="250" cy="118" r="2"/><circle cx="266" cy="102" r="1.6"/>
    <circle cx="238" cy="98" r="1.4"/><circle cx="276" cy="126" r="1.8"/>
  </g>
  <!-- наковальня с клинком -->
  <g fill="#332b23">
    <path d="M300 196 q22 -12 44 0 l-6 14 l-32 0 Z"/>
    <rect x="312" y="210" width="20" height="16"/>
    <rect x="302" y="226" width="40" height="10"/>
  </g>
  <path d="M300 188 l48 -6 l2 6 l-48 6 Z" fill="#7a6a55"/>
  <!-- корыто с водой, пар -->
  <g fill="#2b2620">
    <rect x="356" y="200" width="70" height="22" rx="3"/>
  </g>
  <ellipse cx="391" cy="190" rx="26" ry="10" fill="#4a4a48" opacity="0.25"/>
  <!-- мастер спиной -->
  <g fill="#16130f">
    <path d="M232 118 q20 -24 42 0 l8 62 h-58 Z"/>
    <circle cx="253" cy="112" r="15"/>
  </g>
  <!-- нижняя треть — тёмная и пустая -->
  <rect y="210" width="512" height="78" fill="#0d0b09"/>
</svg>
