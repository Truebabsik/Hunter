<?xml version="1.0" encoding="UTF-8"?>
<!-- Площадь гильдии: каменный двор, неработающий фонтан, кузня дымом.
     Композиция по требованиям: нижняя треть тёмная и пустая. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#1b1a18"/>
  <!-- небо: холодное, пыльное -->
  <rect width="512" height="120" fill="#2b2a2a"/>
  <rect y="96" width="512" height="40" fill="#33322e" opacity="0.7"/>
  <!-- дальние дома -->
  <g fill="#242322">
    <path d="M0 132 L0 96 L60 78 L120 96 L120 132 Z"/>
    <path d="M120 132 L120 88 L196 70 L268 88 L268 132 Z"/>
    <path d="M268 132 L268 100 L336 84 L404 100 L404 132 Z"/>
    <path d="M404 132 L404 92 L470 76 L512 92 L512 132 Z"/>
  </g>
  <!-- кузня: единственный тёплый акцент -->
  <g>
    <rect x="410" y="112" width="70" height="34" fill="#211f1c"/>
    <rect x="440" y="86" width="10" height="28" fill="#2a2724"/>
    <ellipse cx="452" cy="74" rx="20" ry="12" fill="#3a3630" opacity="0.6"/>
    <ellipse cx="445" cy="140" rx="16" ry="9" fill="#c98a4a" opacity="0.55"/>
  </g>
  <!-- площадь -->
  <rect y="132" width="512" height="156" fill="#2e2d2a"/>
  <g fill="#3a3833">
    <path d="M0 150 Q128 140 256 150 Q384 160 512 148 L512 176 L0 176 Z"/>
    <path d="M0 196 Q128 186 256 196 Q384 206 512 194 L512 216 L0 216 Z"/>
  </g>
  <!-- фонтан: сухая чаша с трещиной -->
  <g fill="#4a4740">
    <path d="M186 176 Q256 150 326 176 Q316 200 256 204 Q196 200 186 176 Z"/>
    <rect x="246" y="118" width="20" height="42"/>
    <path d="M232 118 Q256 100 280 118 Q268 130 244 130 Z"/>
  </g>
  <path d="M206 178 L232 196 L214 198 Z" fill="#2a2825"/>
  <!-- рынок справа: навес -->
  <g fill="#3a332a">
    <path d="M330 132 L392 132 L386 150 L336 150 Z"/>
    <rect x="336" y="150" width="8" height="40"/>
    <rect x="378" y="150" width="8" height="40"/>
  </g>
  <!-- фигуры спиной в глубине -->
  <g fill="#191817">
    <path d="M150 150 q6 -14 14 0 l4 30 h-22 Z"/>
    <path d="M172 152 q6 -13 13 0 l4 28 h-21 Z"/>
  </g>
  <!-- нижняя треть — тёмная и пустая (требование под UI) -->
  <rect y="200" width="512" height="88" fill="#141312"/>
</svg>
