<?xml version="1.0" encoding="UTF-8"?>
<!-- Рынок трофеев: прилавок под навесом, трофеи, специи, весы.
     Нижняя треть тёмная под панель интерфейса. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#211d18"/>
  <!-- день, рассеянный свет -->
  <rect width="512" height="120" fill="#3a3630" opacity="0.8"/>
  <!-- навес -->
  <g fill="#463a2c">
    <path d="M40 40 L472 40 L448 78 L64 78 Z"/>
  </g>
  <g fill="#332a20">
    <rect x="60" y="78" width="10" height="120"/>
    <rect x="442" y="78" width="10" height="120"/>
  </g>
  <!-- задняя решётка и мешки со специями -->
  <g fill="#2b241c">
    <rect x="96" y="96" width="320" height="70" opacity="0.55"/>
    <ellipse cx="130" cy="150" rx="22" ry="18"/>
    <ellipse cx="176" cy="156" rx="20" ry="16"/>
    <ellipse cx="330" cy="152" rx="24" ry="18"/>
  </g>
  <!-- весы -->
  <g fill="#4a4034">
    <rect x="366" y="118" width="4" height="34"/>
    <rect x="350" y="112" width="36" height="4"/>
    <path d="M346 118 l10 0 l-5 12 l-10 0 Z"/>
    <path d="M380 118 l10 0 l-5 12 l-10 0 Z"/>
  </g>
  <!-- прилавок: трофеи -->
  <rect x="60" y="176" width="392" height="14" fill="#3d3226"/>
  <g fill="#4f4433">
    <path d="M84 176 q14 -16 30 0 q-14 10 -30 0 Z"/>
    <path d="M124 176 q18 -18 34 0 q-16 10 -34 0 Z"/>
    <path d="M170 168 l10 -22 l8 22 Z"/>
    <path d="M196 176 l56 -6 l-6 8 Z"/>
    <rect x="262" y="158" width="22" height="18" rx="3"/>
    <rect x="292" y="162" width="16" height="14" rx="3"/>
    <ellipse cx="330" cy="170" rx="14" ry="10"/>
    <path d="M356 176 q16 -14 32 0 q-16 8 -32 0 Z"/>
    <rect x="398" y="164" width="40" height="12" rx="2"/>
  </g>
  <!-- подвешенные тушки и ребро -->
  <g fill="#2f2820">
    <ellipse cx="118" cy="106" rx="14" ry="20"/>
    <ellipse cx="150" cy="112" rx="12" ry="18"/>
    <path d="M206 88 q34 6 34 34 q-30 -8 -34 -34 Z"/>
  </g>
  <!-- торговец вполоборота, считает монеты -->
  <g fill="#1b1815">
    <path d="M300 122 q16 -20 32 0 l6 54 h-44 Z"/>
    <circle cx="316" cy="116" r="13"/>
  </g>
  <circle cx="342" cy="170" r="5" fill="#c98a4a" opacity="0.5"/>
  <!-- нижняя треть — тёмная и пустая -->
  <rect y="200" width="512" height="88" fill="#15120f"/>
</svg>
