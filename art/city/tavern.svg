<?xml version="1.0" encoding="UTF-8"?>
<!-- Таверна: очаг, столы, флейтист в глубине, Старик в углу у огня.
     Нижняя треть тёмная под панель интерфейса. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288">
  <rect width="512" height="288" fill="#161310"/>
  <!-- потолок в копоти -->
  <rect width="512" height="30" fill="#0f0d0b"/>
  <rect y="30" width="512" height="130" fill="#221c16"/>
  <!-- очаг -->
  <g>
    <rect x="150" y="120" width="170" height="80" fill="#2b241d"/>
    <path d="M150 120 L235 92 L320 120 Z" fill="#332a21"/>
    <ellipse cx="235" cy="152" rx="60" ry="30" fill="#c98a4a" opacity="0.18"/>
    <ellipse cx="235" cy="162" rx="42" ry="18" fill="#c98a4a" opacity="0.65"/>
    <ellipse cx="235" cy="156" rx="24" ry="11" fill="#e8b070" opacity="0.6"/>
    <path d="M235 132 q10 -16 4 -26 q14 12 8 26 Z" fill="#e8b070" opacity="0.5"/>
    <!-- горшок на цепи -->
    <line x1="235" y1="92" x2="235" y2="126" stroke="#3d3226" stroke-width="3"/>
    <path d="M214 126 q21 20 42 0 q-21 8 -42 0 Z" fill="#2b241d"/>
  </g>
  <!-- искры -->
  <g fill="#e8b070" opacity="0.65">
    <circle cx="258" cy="112" r="1.8"/><circle cx="214" cy="104" r="1.4"/><circle cx="272" cy="124" r="1.6"/>
  </g>
  <!-- флейтист и смеющиеся в глубине -->
  <g fill="#191512">
    <path d="M382 140 q10 -16 20 0 l4 34 h-28 Z"/>
    <circle cx="392" cy="134" r="10"/>
    <path d="M410 140 q10 -15 19 0 l4 32 h-27 Z"/>
    <circle cx="420" cy="135" r="9"/>
  </g>
  <line x1="398" y1="146" x2="428" y2="140" stroke="#4a3f30" stroke-width="3"/>
  <!-- столы и лавки -->
  <g fill="#33291f">
    <rect x="60" y="188" width="140" height="10"/>
    <rect x="72" y="198" width="8" height="24"/>
    <rect x="180" y="198" width="8" height="24"/>
    <rect x="320" y="192" width="150" height="10"/>
    <rect x="332" y="202" width="8" height="22"/>
    <rect x="452" y="202" width="8" height="22"/>
  </g>
  <g fill="#4a3f30">
    <ellipse cx="88" cy="184" rx="9" ry="6"/>
    <ellipse cx="118" cy="183" rx="8" ry="5"/>
    <rect x="146" y="180" width="16" height="8" rx="2"/>
    <ellipse cx="352" cy="188" rx="9" ry="6"/>
    <rect x="382" y="184" width="18" height="8" rx="2"/>
  </g>
  <!-- Старик в углу у очага, спиной к камере, смотрит в огонь -->
  <g fill="#100e0c">
    <path d="M34 156 q16 -26 34 0 q6 30 0 52 h-40 q-6 -22 6 -52 Z"/>
    <circle cx="51" cy="142" r="15"/>
  </g>
  <!-- глиняная чашка перед ним -->
  <ellipse cx="62" cy="208" rx="9" ry="5" fill="#3d3226"/>
  <!-- скамья -->
  <rect x="20" y="208" width="80" height="10" fill="#2b241c"/>
  <!-- нижняя треть — тёмная и пустая -->
  <rect y="218" width="512" height="70" fill="#0c0a08"/>
</svg>
